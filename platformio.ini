; Only build the ESP32 target by default.
; Run native tests with: pio test -e native
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

board_build.partitions = partitions.csv

; --- Flash config for ESP32-S3-N16R8 ---
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio

; --- LittleFS 'games' partition config (matches partitions.csv) ---
board_build.filesystem        = littlefs
board_build.littlefs_start    = 0x810000
board_build.littlefs_size     = 0x400000
board_build.littlefs_pagesize = 256
board_build.littlefs_blocksize= 4096


; --- Custom bootloader hook ---
; ESP-IDF automatically compiles any component inside bootloader_components/
; at the bootloader build stage. Our boot_gpio_hook lives there.
board_build.bootloader_custom_commands = -DBOOTLOADER_COMPONENTS_DIR="${PROJECT_DIR}/bootloader_components"

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CORE_DEBUG_LEVEL=5
    -D CONFIG_LOG_COLORS=1
    -Wall
    -Wextra
build_unflags = -fuse-cxa-atexit

build_type = debug
monitor_filters = esp32_exception_decoder, colorize, time

check_tool = cppcheck, clangtidy
check_flags =
    cppcheck: --enable=all --inline-suppr --std=c++11

; Icon asset pipeline: runs convert_icons.py before every build.
; Converts icons/*.png → src/assets/icons/*.h (RGB565 C arrays).
; Install dependency once: pip install Pillow
extra_scripts = pre:convert_icons.py

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.12

; ─────────────────────────────────────────────────────────────────────
; Native host test environment (runs on Linux/macOS, no hardware)
; Tests pure logic: config assertions, color utils, pool allocator, etc.
; ─────────────────────────────────────────────────────────────────────
[env:native]
platform = native
framework =
test_framework = unity
test_filter = test_*
; Exclude ALL src/ files — tests directly #include the .c files they need.
; src/ requires ESP-IDF headers that don't exist on the host.
build_src_filter = -<**>
build_flags =
    -Isrc
    -Isrc/config
    -Isrc/utils
    -Isrc/platform
    -Isrc/services
    -Isrc/system
    -Isrc/managers
    -Itest/mock
    -DUNITY_INCLUDE_CONFIG_H